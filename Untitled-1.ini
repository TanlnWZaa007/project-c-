#include <iostream>
#include <fstream>
#include <sstream>
#include <vector>
#include <string>
#include <map>
#include <ctime>
#include <cstdlib>
#include <cmath>
#include <iomanip>
#include <algorithm>

using namespace std;

// --- โครงสร้างข้อมูล ---
struct Team {
    string name;
    double totalXG;      // ผลรวม Expected Goals (พลังบุก)
    double totalXGC;     // ผลรวม Expected Goals Conceded (พลังรับ)
    double totalForm;    // ผลรวมฟอร์มนักเตะ
    int playerCount;     // จำนวนนักเตะในทีม
    int fitPlayerCount;  // จำนวนนักเตะที่ไม่เจ็บ
    
    // ค่าพลังที่ปรับสเกลแล้ว (0-10) เพื่อใช้คำนวณผล
    double ratingAttack; 
    double ratingDefense;
    double ratingForm;
    double ratingFitness;
};

// --- ส่วนจัดการ CSV ---

// ฟังก์ชันแยกข้อความด้วยลูกน้ำ (Split String by Comma)
vector<string> parseCSVLine(string line) {
    vector<string> result;
    stringstream ss(line);
    string item;
    
    // CSV บางทีมี , ใน "..." ต้องระวัง (แต่ข้อมูลชุดนี้ดู Clean พอใช้ Logic ง่ายๆ ได้)
    while (getline(ss, item, ',')) {
        result.push_back(item);
    }
    return result;
}

// ฟังก์ชันโหลดและประมวลผลข้อมูลจาก CSV
map<string, Team> processData(string filename) {
    map<string, Team> teams;
    ifstream file(filename);
    
    if (!file.is_open()) {
        cerr << "Error: Cannot open file '" << filename << "'" << endl;
        cerr << "Make sure the .csv file is in the same folder!" << endl;
        return teams;
    }

    string line;
    getline(file, line); // Skip the header line

    while (getline(file, line)) {
        if (line.empty()) continue; // Skip empty lines

        vector<string> cols = parseCSVLine(line);
        if (cols.size() < 47) continue; // Ensure sufficient columns

        string club = cols[1];
        try {
            double form = stod(cols[24]);
            double xG = stod(cols[36]);
            double xGC = stod(cols[39]);
            bool isFit = cols[46].empty(); // Check if player is fit

            teams[club].name = club;
            teams[club].totalXG += xG;
            teams[club].totalXGC += xGC;
            teams[club].totalForm += form;
            teams[club].playerCount++;
            if (isFit) teams[club].fitPlayerCount++;
        } catch (...) {
            cerr << "Error processing line: " << line << endl;
            continue;
        }
    }
    file.close();

    double maxXG = 0, minXGC = 1000;
    for (const auto& [name, team] : teams) {
        maxXG = max(maxXG, team.totalXG);
        if (team.totalXGC > 10) minXGC = min(minXGC, team.totalXGC);
    }

    for (auto& [name, team] : teams) {
        team.ratingAttack = (team.totalXG / maxXG) * 9.5;
        team.ratingDefense = max(2.0, 9.0 - ((team.totalXGC - minXGC) / 20.0));
        team.ratingForm = 0.9 + (team.totalForm / team.playerCount * 0.1);
        team.ratingFitness = static_cast<double>(team.fitPlayerCount) / team.playerCount;
    }

    return teams;
}

// --- ส่วนจำลองการแข่งขัน ---

int simulateGoals(double xG) {
    double L = exp(-xG);
    double p = 1.0;
    int k = 0;
    do {
        k++;
        p *= ((double)rand() / RAND_MAX);
    } while (p > L);
    return k - 1;
}

void playMatch(Team home, Team away) {
    cout << "\n========================================" << endl;
    cout << "   MATCH PREVIEW: " << home.name << " vs " << away.name << endl;
    cout << "========================================" << endl;

    // รายงานค่าพลังที่อ่านได้จากไฟล์ CSV
    cout << "[Data Analysis from CSV]" << endl;
    cout << "   " << home.name << " -> Att: " << fixed << setprecision(1) << home.ratingAttack 
         << " | Def: " << home.ratingDefense 
         << " | Fit: " << (int)(home.ratingFitness*100) << "%" << endl;
         
    cout << "   " << away.name << " -> Att: " << away.ratingAttack 
         << " | Def: " << away.ratingDefense 
         << " | Fit: " << (int)(away.ratingFitness*100) << "%" << endl;

    // คำนวณโอกาสยิง (xG Match)
    double HOME_ADV = 1.15;
    
    double homeXG = (home.ratingAttack / away.ratingDefense) * home.ratingForm * home.ratingFitness * HOME_ADV;
    double awayXG = (away.ratingAttack / home.ratingDefense) * away.ratingForm * away.ratingFitness;

    // ปรับสเกลให้เป็นประตูจริง
    homeXG *= 1.4;
    awayXG *= 1.2;

    cout << "\n   Predicted Match xG: " << setprecision(2) << homeXG << " - " << awayXG << endl;

    // จำลอง 1,000 นัด
    int hWin = 0, aWin = 0, draw = 0;
    int simulations = 1000;
    
    for (int i = 0; i < simulations; i++) {
        int hG = simulateGoals(homeXG);
        int aG = simulateGoals(awayXG);
        if (hG > aG) hWin++;
        else if (aG > hG) aWin++;
        else draw++;
    }

    cout << "[Win Probability]" << endl;
    cout << "   " << home.name << ": " << (hWin * 100.0 / simulations) << "%" << endl;
    cout << "   Draw:      " << (draw * 100.0 / simulations) << "%" << endl;
    cout << "   " << away.name << ": " << (aWin * 100.0 / simulations) << "%" << endl;

    cout << "\n>>> PREDICTION: " << home.name << " " << simulateGoals(homeXG) 
         << " - " << simulateGoals(awayXG) << " " << away.name << " <<<" << endl;
}

int main() {
    srand(time(0));
    
    // ชื่อไฟล์ CSV ที่คุณส่งมา
    string filename = "fpl_player_statistics.csv";
    
    cout << "Loading data from " << filename << "..." << endl;
    map<string, Team> leagueMap = processData(filename);
    
    if (leagueMap.empty()) {
        cout << "Failed to load data. Please check the file name." << endl;
        return 1;
    }

    // แปลง Map เป็น Vector เพื่อให้เลือกง่ายๆ
    vector<Team> league;
    for (auto const& [name, team] : leagueMap) {
        league.push_back(team);
    }

    cout << "Successfully analyzed " << league.size() << " teams.\n" << endl;

    while (true) {
        cout << "--- List of Teams ---" << endl;
        for (size_t i = 0; i < league.size(); i++) {
            cout << "[" << i + 1 << "] " << league[i].name << "\t";
            if ((i + 1) % 3 == 0) cout << endl;
        }
        cout << endl;

        int hIdx, aIdx;
        cout << "\nSelect Home Team ID (0 to exit): ";
        if (!(cin >> hIdx) || hIdx == 0) break;
        cout << "Select Away Team ID: ";
        cin >> aIdx;

        if (hIdx > 0 && hIdx <= league.size() && aIdx > 0 && aIdx <= league.size()) {
            playMatch(league[hIdx - 1], league[aIdx - 1]);
        } else {
            cout << "Invalid selection!" << endl;
        }
        
        cout << "\n------------------------------------------------\n";
    }

    return 0;
}